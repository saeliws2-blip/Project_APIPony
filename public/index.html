<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Pony Top 3</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            padding: 30px 20px;
            background: #8b6fc7;
            color: white;
        }

        header h1 {
            margin: 0 0 8px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }


        /* =========================
           TOP 3
        ========================= */

        .favorite-box {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 30px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }

        .favorite-box h2 {
            margin-top: 0;
            text-align: center;
        }

        .top3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .slot {
            min-height: 180px;

            border: 2px dashed #aaa;
            border-radius: 15px;

            padding: 15px;

            text-align: center;
        }

        .slot img {
            width: 90px;
            height: 90px;

            object-fit: contain;

            display: block;
            margin: auto;
        }

        .slot strong {
            display: block;
            margin-top: 8px;
        }


        /* =========================
           BUTTON
        ========================= */

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .confirm {
            width: 100%;

            margin-top: 20px;

            background: #8b6fc7;
            color: white;

            font-size: 16px;
        }

        .delete {
            margin-top: 8px;

            background: #ff6b6b;
            color: white;
        }


        /* =========================
           SEARCH
        ========================= */

        .controls {
            display: flex;
            gap: 10px;

            margin-bottom: 25px;
        }

        .back-to-top {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 50%;
            background: #8b6fc7;
            color: white;
            font-size: 22px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
            z-index: 900;
        }

        .back-to-top.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        input,
        select {
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        input {
            flex: 1;
        }


        /* =========================
           CHARACTERS
        ========================= */

        .characters {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(180px, 1fr));

            gap: 20px;
        }

        .card {
            background: white;

            border-radius: 15px;

            padding: 15px;

            text-align: center;

            cursor: pointer;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.1);

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 180px;

            object-fit: contain;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.65);

            justify-content: center;
            align-items: center;

            padding: 12px;

            z-index: 1000;
        }

        .modal-content {
            background: white;

            width: 100%;
            max-width: 900px;

            max-height: 92vh;

            overflow-y: auto;

            border-radius: 20px;

            padding: 32px;

            position: relative;
        }

        .close {
            position: absolute;

            right: 20px;
            top: 10px;

            font-size: 30px;

            cursor: pointer;
        }


        /* =========================
           CHARACTER DETAIL
        ========================= */

        .character-detail {
            text-align: center;
        }

        .character-detail img {
            width: 220px;
            height: 220px;

            object-fit: contain;
        }

/* =========================
   CHARACTER INFO
========================= */หน้าตาของกล่องข้อมูลใน Popup

.info {
    text-align: left;

    margin-top: 20px;

    background: #f7f5ff;

    padding: 18px;

    border-radius: 16px;
}


/* ข้อมูลแต่ละช่อง */

.info p {
    background: white;

    margin: 10px 0;

    padding: 12px 15px;

    border-radius: 12px;

    line-height: 1.5;

    border: 1px solid #eee9ff;
}


/* จำนวนตอน */

#modalEpisodes {
    font-weight: bold;

    font-size: 18px;
}


/* Season */

#modalSeasons {
    display: block;
    line-height: 1.6;
}

.season-section {
    background: white;
    margin: 10px 0;
    padding: 14px 15px;
    border-radius: 12px;
    border: 1px solid #eee9ff;
}

.season-section h3 {
    margin: 0 0 8px;
    font-size: 17px;
}

        /* =========================
           FINAL TOP 3
        ========================= */

        .final-list {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-top: 20px;
        }

        .final-card {
            background: #f7f5ff;

            border-radius: 15px;

            padding: 15px;

            text-align: center;
        }

        .final-card img {
            width: 130px;
            height: 130px;

            object-fit: contain;
        }

        .final-card h3 {
            margin-bottom: 10px;
        }

        .final-appearance {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #ded8ef;
            text-align: left;
        }

        .final-appearance p {
            margin: 6px 0;
        }

        .final-appearance h4 {
            margin: 10px 0 6px;
        }

        .final-episode-list {
            max-height: 130px;
            overflow-y: auto;
            margin: 0;
            padding-left: 20px;
        }

        .final-episode-list li {
            padding: 3px 0;
            line-height: 1.4;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;

            padding: 40px;

            font-size: 18px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .modal {
                padding: 10px;
            }

            .modal-content {
                padding: 20px;
            }

            .character-detail img {
                width: 180px;
                height: 180px;
            }

            .controls {
                flex-direction: column;
            }

            .top3,
            .final-list {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

<button
    id="backToTop"
    class="back-to-top"
    type="button"
    aria-label="กลับไปด้านบนสุด"
    title="กลับไปด้านบนสุด"
>
    ↑
</button>

<header>

    <h1>🦄 My Pony Top 3</h1>

    <p>
        Choose your 3 favorite My Little Pony characters
    </p>

</header>



<div class="container">


    <!-- =====================================
         MY TOP 3
    ====================================== -->

    <div class="favorite-box">

        <h2>⭐ My Top 3</h2>


        <div id="top3" class="top3">


            <div class="slot">

                <p>🥇 Rank 1</p>

                <span>
                    ยังไม่ได้เลือก
                </span>

            </div>


            <div class="slot">

                <p>🥈 Rank 2</p>

                <span>
                    ยังไม่ได้เลือก
                </span>

            </div>


            <div class="slot">

                <p>🥉 Rank 3</p>

                <span>
                    ยังไม่ได้เลือก
                </span>

            </div>


        </div>


        <button
            class="confirm"
            onclick="confirmTop3()"
        >
            ✓ ยืนยัน Top 3
        </button>

    </div>



    <!-- =====================================
         SEARCH
    ====================================== -->

    <h2>
        🔎 เลือกตัวละคร
    </h2>


    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="ค้นหาชื่อตัวละคร..."
        >


        <select id="nameSort" aria-label="เรียงชื่อตัวละคร">

            <option value="az">
                A - Z
            </option>

            <option value="za">
                Z - A
            </option>

        </select>

        <select id="seasonSort" aria-label="เรียงตามซีซัน">
            <option value="all">ทุกซีซัน</option>
            <option value="1">Season 1</option>
            <option value="2">Season 2</option>
            <option value="3">Season 3</option>
            <option value="4">Season 4</option>
            <option value="5">Season 5</option>
            <option value="6">Season 6</option>
            <option value="7">Season 7</option>
            <option value="8">Season 8</option>
            <option value="9">Season 9</option>

        </select>

    </div>



    <!-- =====================================
         CHARACTER LIST
    ====================================== -->

    <div
        id="characters"
        class="characters"
    >

        <div class="loading">
            Loading characters...
        </div>

    </div>

</div>



<!-- =================================================
     CHARACTER DETAIL MODAL
================================================= -->

<div
    id="characterModal"
    class="modal"
>

    <div class="modal-content">

        <span
            class="close"
            onclick="closeCharacterModal()"
        >
            ×
        </span>


        <div class="character-detail">

            <img
                id="modalImage"
                src=""
                alt="Character"
            >


            <h2 id="modalName">
            </h2>


            <div class="info">

                <p>
                    <strong>เพศ:</strong>
                    <span id="modalSex">
                    </span>
                </p>


                <p>
                    <strong>ความสามารถ / อาชีพ:</strong>
                    <span id="modalAbility">
                    </span>
                </p>

                <p>
                    <strong>จำนวนตอนที่ปรากฏ:</strong>
                    <span id="modalEpisodes">
                        -
                    </span>
                </p>


                <div class="season-section">
                    <h3>ซีซันที่ปรากฏ</h3>
                    <span id="modalSeasons">
                        -
                    </span>
                </div>

            </div>


            <button
                class="confirm"
                onclick="addCharacter()"
            >
                + เพิ่มใน My Top 3
            </button>

        </div>

    </div>

</div>



<!-- =================================================
     FINAL TOP 3 MODAL
================================================= -->

<div
    id="finalModal"
    class="modal"
>

    <div class="modal-content">

        <span
            class="close"
            onclick="closeFinalModal()"
        >
            ×
        </span>


        <h2 style="text-align:center;">
            🏆 My Top 3
        </h2>


        <p style="text-align:center;">
            ตัวละครที่คุณเลือก
        </p>


        <div
            id="finalList"
            class="final-list"
        >
        </div>

    </div>

</div>



<script>


// =================================================
// VARIABLES
// =================================================

let characters = [];

let top3 = [];

let selectedCharacter = null;


// =================================================
// LOAD CHARACTERS
// =================================================

async function loadCharacters() {

    try {

        const response =
            await fetch("/characters");


        if (!response.ok) {

            throw new Error(
                "ไม่สามารถโหลดข้อมูลได้"
            );

        }


        const result =
            await response.json();


        characters =
            result.data;


        displayCharacters();


    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "characters"
        ).innerHTML = `

            <div class="loading">

                ❌ ไม่สามารถโหลดข้อมูลตัวละครได้

            </div>

        `;

    }

}


// =================================================
// DISPLAY CHARACTERS
// =================================================

function displayCharacters() {

    const container =
        document.getElementById(
            "characters"
        );


    const keyword =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase();


    let list =
        characters.filter(character => {

            const name =
                (character.name || "")
                .toLowerCase();

            const alias =
                (character.alias || "")
                .toLowerCase();


            return (
                name.includes(keyword) ||
                alias.includes(keyword)
            );

        });


    // ==============================
    // SORT
    // ==============================

    const nameSort =
        document.getElementById(
            "nameSort"
        ).value;

    const seasonSort =
        document.getElementById(
            "seasonSort"
        ).value;

    list.sort((a, b) => {
        if (seasonSort !== "all") {
            const season = Number(seasonSort);
            const aInSeason = a.seasons?.includes(season) ? 1 : 0;
            const bInSeason = b.seasons?.includes(season) ? 1 : 0;

            if (aInSeason !== bInSeason) {
                return bInSeason - aInSeason;
            }
        }

        const nameOrder = a.name.localeCompare(b.name);
        return nameSort === "za" ? -nameOrder : nameOrder;
    });


    container.innerHTML = "";


    list.forEach(character => {

        const card =
            document.createElement("div");


        card.className = "card";


        const image =
            character.image &&
            character.image.length
                ? character.image[0]
                : "";


        card.innerHTML = `

            <img
                src="${image}"
                alt="${character.name}"
            >

            <h3>
                ${character.name}
            </h3>

        `;


        card.onclick = () => {

            openCharacterModal(
                character
            );

        };


        container.appendChild(card);

    });

}


// =================================================
// OPEN CHARACTER MODAL
// =================================================

async function openCharacterModal(character) {

    selectedCharacter =
        character;


    const image =
        character.image &&
        character.image.length
            ? character.image[0]
            : "";


    document.getElementById(
        "modalImage"
    ).src = image;


    document.getElementById(
        "modalName"
    ).textContent =
        character.name;


    document.getElementById(
        "modalSex"
    ).textContent =
        character.sex || "ไม่มีข้อมูล";


    // =====================================
    // ความสามารถ / อาชีพ
    // =====================================

    document.getElementById(
        "modalAbility"
    ).textContent =

        character.occupation ||
        character.kind?.join(", ") ||
        "ไม่มีข้อมูล";


// =====================================
// Episodes / Seasons
// =====================================

document.getElementById(
    "modalEpisodes"
).textContent =
    "กำลังโหลด...";

document.getElementById(
    "modalSeasons"
).textContent =
    "กำลังโหลด...";


try {

    const response =
        await fetch(
            `/characters/${character.id}`
        );


    if (!response.ok) {

        throw new Error(
            "โหลดข้อมูล Character ไม่สำเร็จ"
        );

    }


    const data =
        await response.json();


    // ---------------------------------
    // จำนวนตอน
    // ---------------------------------

    document.getElementById(
        "modalEpisodes"
    ).textContent =

        data.episodeCount > 0

            ? `${data.episodeCount} ตอน`

            : "ไม่มีข้อมูล";


    // ---------------------------------
    // Season
    // ---------------------------------

    document.getElementById(
        "modalSeasons"
    ).textContent =

        data.seasons &&
        data.seasons.length > 0

            ? data.seasons
                .map(
                    season =>
                        `Season ${season}`
                )
                .join(", ")

            : "ไม่มีข้อมูล";


} catch (error) {

    console.error(error);


    document.getElementById(
        "modalEpisodes"
    ).textContent =
        "โหลดข้อมูลไม่สำเร็จ";


    document.getElementById(
        "modalSeasons"
    ).textContent =
        "โหลดข้อมูลไม่สำเร็จ";

}

    document.getElementById(
        "characterModal"
    ).style.display =
        "flex";

}


// =================================================
// CLOSE CHARACTER MODAL
// =================================================

function closeCharacterModal() {

    document.getElementById(
        "characterModal"
    ).style.display =
        "none";

}


// =================================================
// ADD CHARACTER
// =================================================

function addCharacter() {

    if (!selectedCharacter) {
        return;
    }


    // ห้ามเลือกซ้ำ

    const duplicate =
        top3.some(character =>
            character.id ===
            selectedCharacter.id
        );


    if (duplicate) {

        alert(
            "ตัวละครนี้ถูกเลือกแล้ว"
        );

        return;

    }


    // จำกัด 3 ตัว

    if (top3.length >= 3) {

        alert(
            "เลือกได้สูงสุด 3 ตัวละคร"
        );

        return;

    }


    top3.push(
        selectedCharacter
    );


    updateTop3();


    closeCharacterModal();

}


// =================================================
// UPDATE TOP 3
// =================================================

function updateTop3() {

    const container =
        document.getElementById(
            "top3"
        );


    container.innerHTML = "";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot";


        const medals = [
            "🥇",
            "🥈",
            "🥉"
        ];


        if (top3[i]) {

            const character =
                top3[i];


            const image =
                character.image &&
                character.image.length
                    ? character.image[0]
                    : "";


            slot.innerHTML = `

                <p>
                    ${medals[i]}
                    Rank ${i + 1}
                </p>

                <img
                    src="${image}"
                    alt="${character.name}"
                >

                <strong>
                    ${character.name}
                </strong>

                <button
                    class="delete"
                    onclick="removeCharacter(${i})"
                >
                    🗑 ลบ
                </button>

            `;

        }

        else {

            slot.innerHTML = `

                <p>
                    ${medals[i]}
                    Rank ${i + 1}
                </p>

                <span>
                    ยังไม่ได้เลือก
                </span>

            `;

        }


        container.appendChild(slot);

    }

}


// =================================================
// REMOVE
// =================================================

function removeCharacter(index) {

    top3.splice(
        index,
        1
    );


    updateTop3();

}


// =================================================
// CONFIRM TOP 3
// =================================================

function confirmTop3() {

    if (top3.length !== 3) {

        alert(
            "กรุณาเลือกตัวละครให้ครบ 3 ตัว"
        );

        return;

    }


    const finalList =
        document.getElementById(
            "finalList"
        );


    finalList.innerHTML = "";


    const medals = [
        "🥇",
        "🥈",
        "🥉"
    ];


    top3.forEach(
        (character, index) => {


            const image =
                character.image &&
                character.image.length
                    ? character.image[0]
                    : "";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "final-card";


            card.innerHTML = `

                <h3>
                    ${medals[index]}
                    Rank ${index + 1}
                </h3>

                <img
                    src="${image}"
                    alt="${character.name}"
                >

                <h3>
                    ${character.name}
                </h3>

                <p>
                    เพศ:
                    ${character.sex || "ไม่มีข้อมูล"}
                </p>

                <p>
                    ความสามารถ:
                    ${
                        character.occupation ||
                        "ไม่มีข้อมูล"
                    }
                </p>

                <p>
                    ประเภท:
                    ${
                        character.kind
                            ? character.kind.join(", ")
                            : "ไม่มีข้อมูล"
                    }
                </p>

            `;


            const appearanceSection =
                document.createElement("section");

            appearanceSection.className =
                "final-appearance";

            const seasons =
                document.createElement("p");

            seasons.textContent =
                `ซีซันที่ปรากฏ: ${character.seasons?.length
                    ? character.seasons.map(season => `Season ${season}`).join(", ")
                    : "ไม่มีข้อมูล"}`;

            appearanceSection.appendChild(seasons);

            const episodeCount =
                document.createElement("p");

            episodeCount.textContent =
                `จำนวนตอนที่ปรากฏ: ${character.episodeCount ?? 0} ตอน`;

            appearanceSection.appendChild(episodeCount);

            const episodeHeading =
                document.createElement("h4");

            episodeHeading.textContent =
                "ตอนที่ปรากฏ";

            appearanceSection.appendChild(episodeHeading);

            const episodeList =
                document.createElement("ul");

            episodeList.className =
                "final-episode-list";

            if (character.appearanceEpisodes?.length) {

                character.appearanceEpisodes.forEach(episode => {

                    const item =
                        document.createElement("li");

                    item.textContent =
                        `${episode.code}: ${episode.name}`;

                    episodeList.appendChild(item);

                });

            } else {

                const item =
                    document.createElement("li");

                item.textContent =
                    "ไม่มีข้อมูล";

                episodeList.appendChild(item);

            }

            appearanceSection.appendChild(episodeList);
            card.appendChild(appearanceSection);


            finalList.appendChild(card);

        }
    );


    document.getElementById(
        "finalModal"
    ).style.display =
        "flex";

}


// =================================================
// CLOSE FINAL MODAL
// =================================================

function closeFinalModal() {

    document.getElementById(
        "finalModal"
    ).style.display =
        "none";

}


// =================================================
// SEARCH
// =================================================

document
    .getElementById("search")
    .addEventListener(
        "input",
        displayCharacters
    );


// =================================================
// SORT
// =================================================

document
    .getElementById("nameSort")
    .addEventListener(
        "change",
        displayCharacters
    );

document
    .getElementById("seasonSort")
    .addEventListener(
        "change",
        displayCharacters
    );

const backToTopButton =
    document.getElementById("backToTop");

window.addEventListener("scroll", () => {
    backToTopButton.classList.toggle(
        "is-visible",
        window.scrollY > 300
    );
}, { passive: true });

backToTopButton.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
});


// =================================================
// START
// =================================================

loadCharacters();


</script>

</body>
</html>
